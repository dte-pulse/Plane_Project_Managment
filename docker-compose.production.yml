services:
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: "1"
        VITE_API_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_WEB_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_ADMIN_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_LIVE_BASE_PATH: /live
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: "1"
        VITE_API_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_API_BASE_PATH: ""
        VITE_WEB_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_WEB_BASE_PATH: ""
        VITE_ADMIN_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_LIVE_BASE_PATH: /live
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  space:
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: "1"
        VITE_API_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_API_BASE_PATH: ""
        VITE_WEB_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_WEB_BASE_PATH: ""
        VITE_ADMIN_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: ${PLANE_PUBLIC_URL:?PLANE_PUBLIC_URL is required}
        VITE_LIVE_BASE_PATH: /live
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: "1"
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ${PLANE_API_ENV_FILE:?PLANE_API_ENV_FILE is required}
    depends_on:
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: "1"
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ${PLANE_API_ENV_FILE:?PLANE_API_ENV_FILE is required}
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started

  beat-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: "1"
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ${PLANE_API_ENV_FILE:?PLANE_API_ENV_FILE is required}
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-mq:
        condition: service_started

  migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: "1"
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ${PLANE_API_ENV_FILE:?PLANE_API_ENV_FILE is required}

  live:
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: "1"
    restart: unless-stopped
    env_file:
      - ${PLANE_LIVE_ENV_FILE:?PLANE_LIVE_ENV_FILE is required}
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_started

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - plane-redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    env_file:
      - ${PLANE_ROOT_ENV_FILE:?PLANE_ROOT_ENV_FILE is required}
    volumes:
      - plane-rabbitmq-data:/var/lib/rabbitmq

  proxy:
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
      args:
        DOCKER_BUILDKIT: "1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLANE_PROXY_PORT:?PLANE_PROXY_PORT is required}:80"
    environment:
      SITE_ADDRESS: ":80"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
    volumes:
      - ${PLANE_PROXY_CONFIG:?PLANE_PROXY_CONFIG is required}:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_started
      admin:
        condition: service_started
      space:
        condition: service_started
      api:
        condition: service_started
      live:
        condition: service_started

volumes:
  plane-redisdata:
  plane-rabbitmq-data:
